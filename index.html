<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Don't Think - Just Solve (v4.2.6)</title>
<style>
:root {
--bg-color: #0c0a0f;
--panel-bg: #14111a;
--card-inner: #1b1724;
--text-color: #f0f3f8;
--neon-magenta: #e100ff;
--neon-pink: #ff3399;
--neon-cyan: #00f3ff;
--neon-gold: #ffaa00;
--neon-green: #39ff14;
--border-color: #2a2338;
}
body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: system-ui, sans-serif;
margin: 0;
padding: 10px;
display: flex;
flex-direction: column;
align-items: center;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
background-attachment: fixed;
min-height: 100vh;
box-sizing: border-box;
}

/* 🏎️ Desktop Adaptive Responsive Wrapper Configuration */
.phone-container {
width: 100%;
max-width: 420px; /* Base mobile layout default lock */
background: rgba(20, 17, 26, 0.9);
border-radius: 20px;
padding: 15px;
box-shadow: 0 10px 30px rgba(0,0,0,0.7);
border: 1px solid var(--border-color);
box-sizing: border-box;
backdrop-filter: blur(8px);
transition: max-width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
}

/* 🖥️ PC Screen Widening Integration */
@media (min-width: 768px) {
    .phone-container {
        max-width: 920px; /* Safely widens up the interface for desktop windows */
    }
    /* Creates a side-by-side grid structure */
    .pc-split-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 20px;
        align-items: start;
    }
    .leaderboard-list {
        max-height: 380px !important; /* Expansion allocation for tall screens */
    }
}

.top-bar {
display: flex;
justify-content: space-between;
align-items: center;
font-size: 11px;
color: #665c78;
margin-bottom: 10px;
}
.mode-badge {
background: transparent;
color: var(--neon-cyan);
border: 1px solid var(--neon-cyan);
padding: 2px 8px;
border-radius: 4px;
font-weight: bold;
cursor: pointer;
}
.mode-cube {
color: var(--neon-pink);
border-color: var(--neon-pink);
}
.tabs {
display: flex;
justify-content: center;
gap: 20px;
margin-bottom: 10px;
font-size: 13px;
font-weight: bold;
color: #554d63;
}
.tab-btn {
cursor: pointer;
padding-bottom: 4px;
white-space: nowrap;
}
.tab-active {
color: var(--text-color);
border-bottom: 2px solid var(--neon-magenta);
}
.scramble-box {
background: rgba(0,0,0,0.3);
border: 1px solid var(--border-color);
border-radius: 8px;
padding: 8px;
font-size: 13px;
color: var(--neon-cyan);
text-shadow: 0 0 5px rgba(0,243,255,0.3);
text-align: center;
font-family: monospace;
margin-bottom: 15px;
word-wrap: break-word;
transition: all 0.2s ease;
}
.scramble-4x4 {
font-size: 11px !important;
line-height: 1.3;
padding: 6px;
}
.vr-display-container {
text-align: center;
margin-bottom: 20px;
padding: 15px;
border-radius: 12px;
background: rgba(0,0,0,0.2);
border: 1px solid var(--border-color);
transition: all 1s ease;
}
.new-record-tag {
color: var(--neon-pink);
font-size: 11px;
font-weight: bold;
letter-spacing: 2px;
margin-bottom: 5px;
visibility: hidden;
}

.tier-tag {
font-size: 15px;
font-weight: bold;
letter-spacing: 1px;
transition: color 1s, text-shadow 1s;
-webkit-text-stroke: 0px transparent; /* Reset default setup */
}

.vr-number {
font-size: 72px;
font-weight: 900;
margin: 5px 0;
font-family: monospace;
transition: all 1.5s ease;
}
.style-unreal-text {
background: linear-gradient(to right, #00f3ff, #ff00ff);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.6)) drop-shadow(0 0 30px rgba(255, 0, 255, 0.4));
}
.style-unreal-border {
border-color: #ff00ff !important;
box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(255, 0, 255, 0.1);
}
.grid-stats {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 20px;
}
.stat-card {
background: var(--card-inner);
border: 1px solid var(--border-color);
border-radius: 8px;
padding: 10px;
text-align: center;
}
.stat-label {
font-size: 10px;
color: #7d7294;
margin-bottom: 4px;
}
.stat-value {
font-size: 16px;
font-weight: bold;
}
.color-pink { color: var(--neon-pink); }
.color-cyan { color: var(--neon-cyan); }
.ao5-history-bar {
display: flex;
justify-content: space-between;
gap: 5px;
margin-bottom: 25px;
}
.ao5-slot {
flex: 1;
background: var(--card-inner);
border: 1px solid var(--border-color);
border-radius: 4px;
height: 24px;
display: flex;
align-items: center;
justify-content: center;
font-size: 11px;
color: #554d63;
transition: all 0.4s ease;
cursor: pointer;
user-select: none;
}
.ao5-slot-active {
color: var(--neon-cyan);
border-color: rgba(0, 243, 255, 0.3);
background: rgba(0, 243, 255, 0.05);
}
.ao5-slot-plus2 {
color: var(--neon-gold) !important;
border-color: rgba(255, 170, 0, 0.4) !important;
background: rgba(255, 170, 0, 0.08) !important;
}
.ao5-slot-dnf {
color: var(--neon-pink) !important;
border-color: rgba(255, 51, 153, 0.4) !important;
background: rgba(255, 51, 153, 0.08) !important;
}
.input-section {
border-top: 1px solid var(--border-color);
border-bottom: 1px solid var(--border-color);
padding: 15px 0;
text-align: center;
margin-bottom: 15px;
}
.time-enter-hint {
font-size: 22px;
font-weight: bold;
color: #7d7294;
margin-left: 10px;
}
#manual-input {
background: transparent;
border: none;
color: var(--neon-cyan);
font-size: 24px;
font-weight: bold;
text-align: center;
width: 120px;
border-bottom: 2px solid var(--border-color);
outline: none;
}
.fun-input-group {
margin-top: 12px;
display: none;
flex-direction: column;
align-items: center;
gap: 8px;
}
#fun-vr-field {
background: #231c30;
border: 1px solid var(--border-color);
color: var(--neon-green);
padding: 6px;
border-radius: 4px;
text-align: center;
font-weight: bold;
outline: none;
width: 140px;
}
.fun-btn {
background: var(--card-inner);
color: var(--neon-cyan);
border: 1px solid var(--border-color);
padding: 6px 12px;
border-radius: 4px;
font-size: 12px;
cursor: pointer;
font-weight: bold;
}
.battle-report-bar {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
}
.rank-badge {
font-size: 24px;
font-weight: 900;
color: var(--neon-cyan);
text-shadow: 0 0 10px rgba(0,243,255,0.4);
}
.vr-change-badge {
font-size: 18px;
font-weight: 900;
opacity: 0;
transform: translateY(10px);
transition: all 0.4s ease;
}
.vr-change-show {
opacity: 1;
transform: translateY(0);
}
.vr-plus { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
.vr-minus { color: var(--neon-pink); text-shadow: 0 0 8px var(--neon-pink); }
.lobby-summary {
font-size: 11px;
color: #6d6480;
margin-bottom: 15px;
}
.lobby-summary span { color: #a197ba; }
.leaderboard-title {
font-size: 12px;
font-weight: bold;
color: #7d7294;
margin-bottom: 10px;
}
.leaderboard-list {
display: flex;
flex-direction: column;
gap: 6px;
max-height: 180px;
overflow-y: auto;
}
.leaderboard-row {
display: flex;
justify-content: space-between;
font-size: 12px;
padding: 6px 8px;
border-radius: 4px;
background: #191522;
opacity: 0;
transform: translateX(30px);
}
@keyframes slideInRow {
to { opacity: 1; transform: translateX(0); }
}
.row-player {
background: rgba(255, 38, 225, 0.15) !important;
border: 1px solid var(--neon-magenta) !important;
font-weight: bold;
}
.col-left { display: flex; gap: 12px; align-items: center; }
.col-right { display: flex; gap: 15px; font-family: monospace; align-items: center; }
.bot-rank { color: var(--neon-gold); font-weight: 900; }
.bot-name { color: #c3bcda; }
.bot-vr { color: #5c546d; }
.bot-time { font-weight: bold; color: var(--neon-gold); }
.player-time { color: var(--neon-cyan) !important; text-shadow: 0 0 5px var(--neon-cyan); }
.upload-btn-container {
margin-top: 15px;
text-align: center;
}
#bg-upload { display: none; }
.upload-label {
background: #231c30;
color: #a197ba;
border: 1px solid var(--border-color);
padding: 8px 16px;
border-radius: 6px;
font-size: 12px;
cursor: pointer;
display: inline-block;
}
</style>
</head>
<body>
        <div class="phone-container">
        <div class="top-bar">
            <span>Life = Cube = Life :3</span>
            <button class="mode-badge mode-cube" id="ui-mode-toggle" onclick="toggleMode()">MODE: CUBE</button>
        </div>
        <div class="tabs" id="ui-tabs-container">
            <span class="tab-btn tab-active" onclick="switchUniverse('3x3')">3x3</span>
            <span class="tab-btn" onclick="switchUniverse('2x2')">2x2</span>

            </div>
            <div class="stat-card">
                <div class="stat-label">Baseline</div>

            </div>

                <div class="stat-label">Win % / Podiums</div>
                <div class="stat-value color-cyan" id="ui-podium-rate">0% / 0</div>
            </div>
        </div>
        <div class="ao5-history-bar" id="ui-ao5-slots">
            <div class="ao5-slot">-</div>
            <div class="ao5-slot">-</div>
            <div class="ao5-slot">-</div>
            <div class="ao5-slot">-</div>
            <div class="ao5-slot">-</div>
        </div>
        <div class="input-section">
            <input type="number" step="0.01" id="manual-input" placeholder="0.00" onkeydown="handleEnter(event)">
            <span class="time-enter-hint" id="ui-input-hint">TIME + ENTER</span>
            <div class="live-timer-display" id="ui-live-timer-panel" onclick="triggerTimerInteraction()">TAP / SPACE TO INSPECT</div>
            <div class="fun-input-group" id="ui-fun-inputs">
                <input type="number" id="fun-vr-field" placeholder="Enter VR (1-9999)">
                <button class="fun-btn" onclick="triggerFunSetVR()">SET CUSTOM VR</button>
            </div>
        </div>
        <div class="battle-report-bar">
            <div class="rank-badge" id="ui-match-rank">--- / 24th</div>
            <div class="vr-change-badge" id="ui-vr-change">+0 VR</div>
        </div>
        <div class="lobby-summary">
            Room Average VR: <span id="ui-room-avg">-</span> | 
            Multiplier: <span id="ui-multiplier">-</span> | 
            ao5: <span id="ui-current-ao5">-</span>
        </div>
        <div class="leaderboard-title">🏁 Race Results: </div>
        <div class="leaderboard-list" id="ui-leaderboard-list"></div>
<!-- ⚡【修復 Part 2】：在照片上傳右側精準置入一鍵清空天梯數據按鈕 -->
<div class="upload-btn-container" style="display: flex; justify-content: center; gap: 10px;">
    <label for="bg-upload" class="upload-label">📸 Select Photos </label>
    <input type="file" id="bg-upload" accept="image/*" onchange="handleBackgroundUpload(event)">
    <button class="upload-label" onclick="forceClearAllData()" style="background: #4a1525; color: var(--neon-pink); border-color: rgba(255, 51, 153, 0.4); font-weight: bold;">🗑️ Reset Data</button>
</div>
    </div>

    <script>
                // ⚡【永久備份存檔盾】
        let playerVR = JSON.parse(localStorage.getItem('mkwcube_playerVR')) || { "3x3": 1, "2x2": 1, "4x4": 1, "OH": 1 };
        let peakVR = JSON.parse(localStorage.getItem('mkwcube_peakVR')) || { "3x3": 1, "2x2": 1, "4x4": 1, "OH": 1 };
        let totalMatches = JSON.parse(localStorage.getItem('mkwcube_totalMatches')) || { "3x3": 0, "2x2": 0, "4x4": 0, "OH": 0 };
        let podiumCount = JSON.parse(localStorage.getItem('mkwcube_podiumCount')) || { "3x3": 0, "2x2": 0, "4x4": 0, "OH": 0 };

        let recentScores = { "3x3": [], "2x2": [], "4x4": [], "OH": [] };
        let currentSolvePool = [];
        let currentPoolStates = []; 
        let currentUniverse = "3x3";
        let currentMode = "CUBE"; // CUBE, FUN, TIMER
        let persistentLobby = [];

        // ⚡【WCA & csTimer 核心計時狀態機系統變數】
        let wcaState = "IDLE"; // IDLE, INSPECTION, RUNNING
        let wcaIntervalId = null;
        let wcaStartTime = 0;
        let inspectionCountdown = 15;

        function saveGameData() {
            localStorage.setItem('mkwcube_playerVR', JSON.stringify(playerVR));
            localStorage.setItem('mkwcube_peakVR', JSON.stringify(peakVR));
            localStorage.setItem('mkwcube_totalMatches', JSON.stringify(totalMatches));
            localStorage.setItem('mkwcube_podiumCount', JSON.stringify(podiumCount));
        }

        const UNIVERSE_CONFIG = {
            "3x3": { base: 5, div: 200, minB: 5.0 },
            "2x2": { base: 1.5, div: 800, minB: 1.0 },
            "4x4": { base: 20, div: 80, minB: 16.0 }, 
            "OH": { base: 12, div: 125, minB: 8.5 }
        };

        const TIER_MATRIX = [
            { min: 9999, name: "[UNREAL]", color: "linear-gradient" },
            { min: 9800, name: "[LEGENDARY 5]", color: "#ff007f" },
            { min: 9600, name: "[LEGENDARY 4]", color: "#ff00bb" },
            { min: 9400, name: "[LEGENDARY 3]", color: "#ff00ff" },
            { min: 9200, name: "[LEGENDARY 2]", color: "#cc00ff" },
            { min: 9000, name: "[LEGENDARY 1]", color: "#9900ff" },
            { min: 8800, name: "[MASTER 5]", color: "#ffaa00" },
            { min: 8600, name: "[MASTER 4]", color: "#ffbb00" },
            { min: 8400, name: "[MASTER 3]", color: "#ffcc00" },
            { min: 8200, name: "[MASTER 2]", color: "#ffdd00" },
            { min: 8000, name: "[MASTER 1]", color: "#ffee00" },
            { min: 7500, name: "[PRO 5]", color: "#66ee33" },
            { min: 7000, name: "[PRO 4]", color: "#00ff66" },
            { min: 6500, name: "[PRO 3]", color: "#00ff99" },
            { min: 6000, name: "[PRO 2]", color: "#00ffcc" },
            { min: 5500, name: "[PRO 1]", color: "#00ffff" },
            { min: 4800, name: "[ELITE 5]", color: "#00ccff" },
            { min: 4100, name: "[ELITE 4]", color: "#3399ff" },
            { min: 3400, name: "[ELITE 3]", color: "#5588ff" },
            { min: 2700, name: "[ELITE 2]", color: "#7777ff" },
            { min: 2000, name: "[ELITE 1]", color: "#9966ff" },
            { min: 1600, name: "[NEWBIE 5]", color: "#a197ba" },
            { min: 1200, name: "[NEWBIE 4]", color: "#8d83a8" },
            { min: 800, name: "[NEWBIE 3]", color: "#796f96" },
            { min: 400, name: "[NEWBIE 2]", color: "#655c84" },
            { min: 1, name: "[NEWBIE 1]", color: "#514a72" }
        ];

        function updateTierGraphics(targetVR) {
            let activeTier = TIER_MATRIX[TIER_MATRIX.length - 1];
            for (let i = 0; i < TIER_MATRIX.length; i++) {
                if (targetVR >= TIER_MATRIX[i].min) {
                    activeTier = TIER_MATRIX[i];
                    break;
                }
            }
            const tierTag = document.getElementById("ui-tier-name");
            const vrNum = document.getElementById("ui-player-vr");
            const glowBox = document.getElementById("ui-glow-box");
            tierTag.innerText = activeTier.name;
            if (activeTier.min === 9999) {
                tierTag.className = "tier-tag style-unreal-text";
                vrNum.className = "vr-number style-unreal-text";
                glowBox.classList.add("style-unreal-border");
            } else {
                tierTag.className = "tier-tag";
                vrNum.className = "vr-number";
                glowBox.classList.remove("style-unreal-border");
                tierTag.style.color = activeTier.color;
                vrNum.style.color = activeTier.color;
                vrNum.style.textShadow = `0 0 20px ${activeTier.color}`;
                glowBox.style.borderColor = activeTier.color;
                glowBox.style.boxShadow = `0 0 15px ${activeTier.color}44`;
            }
        }
// ⚡ 三模流暢切換器
        function toggleMode() {
            const btn = document.getElementById("ui-mode-toggle");
            const funArea = document.getElementById("ui-fun-inputs");
            const manualIn = document.getElementById("manual-input");
            const inputHint = document.getElementById("ui-input-hint");
            const liveTimer = document.getElementById("ui-live-timer-panel");

            if (currentMode === "CUBE") {
                currentMode = "FUN";
                btn.innerText = "MODE: FUN";
                btn.className = "mode-badge"; 
                funArea.style.display = "flex";
                manualIn.style.display = "inline-block";
                inputHint.style.display = "inline";
                liveTimer.style.display = "none";
            } else if (currentMode === "FUN") {
                currentMode = "TIMER";
                btn.innerText = "MODE: TIMER";
                btn.className = "mode-badge mode-timer";
                funArea.style.display = "none";
                manualIn.style.display = "none";
                inputHint.style.display = "none";
                liveTimer.style.display = "block";
                resetWcaTimerUi();
            } else {
                currentMode = "CUBE";
                btn.innerText = "MODE: CUBE";
                btn.className = "mode-badge mode-cube";
                funArea.style.display = "none";
                manualIn.style.display = "inline-block";
                inputHint.style.display = "inline";
                liveTimer.style.display = "none";
                if (wcaIntervalId) clearInterval(wcaIntervalId);
                wcaState = "IDLE";
            }
        }
                function triggerFunSetVR() {
            if (currentMode !== "FUN") return;
            const val = parseInt(document.getElementById("fun-vr-field").value);
            if (isNaN(val) || val < 1 || val > 9999) {
                alert("PLZ ENTER A NUMBER BETWEEN 1 AND 9999");
                return;
            }
            playerVR[currentUniverse] = val;
            if (playerVR[currentUniverse] > peakVR[currentUniverse]) peakVR[currentUniverse] = playerVR[currentUniverse];
            document.getElementById("ui-player-vr").innerText = playerVR[currentUniverse];
            document.getElementById("ui-peak-vr").innerText = peakVR[currentUniverse];
            const config = UNIVERSE_CONFIG[currentUniverse];
            const currentBaseline = config.base + (10000 - playerVR[currentUniverse]) / config.div;
            document.getElementById("ui-baseline-val").innerText = `${Math.max(config.minB, currentBaseline).toFixed(2)}s`;
            updateTierGraphics(playerVR[currentUniverse]);
            saveGameData();
            initLobby();
        }

        function handleBackgroundUpload(event) {
            const file = event.target.files; 
            if (file && file.length > 0) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.body.style.backgroundImage = "url('" + e.target.result + "')";
                };
                reader.readAsDataURL(file[0]);
            }
        }

        function generate3x3Scramble() {
            const faces = ["R", "L", "U", "D", "F", "B"];
            const axes = "001122".split("").map(Number);
            const modifiers = ["", "'", "2"];
            let scramble = [];
            let lastFace = -1;
            let secondLastFace = -1;
            for (let i = 0; i < 20; i++) {
                let chosenFaceIdx, chosenAxis;
                while (true) {
                    chosenFaceIdx = Math.floor(Math.random() * faces.length);
                    chosenAxis = axes[chosenFaceIdx];
                    if (chosenFaceIdx === lastFace) continue;
                    if (lastFace !== -1 && axes[lastFace] === chosenAxis) {
                        if (chosenFaceIdx === secondLastFace) continue;
                    }
                    break;
                }
                let modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(faces[chosenFaceIdx] + modifier);
                secondLastFace = lastFace;
                lastFace = chosenFaceIdx;
            }
            return scramble.join(" ");
        }

        function generate4x4Scramble() {
            const movesConfig = [
                { face: "R", axis: 0 }, { face: "L", axis: 0 }, { face: "Rw", axis: 0 },
                { face: "U", axis: 1 }, { face: "D", axis: 1 }, { face: "Uw", axis: 1 },
                { face: "F", axis: 2 }, { face: "B", axis: 2 }, { face: "Fw", axis: 2 }
            ];
            const modifiers = ["", "'", "2"];
            let scramble = [];
            let lastMoveIdx = -1;
            let secondLastMoveIdx = -1;
            for (let i = 0; i < 40; i++) {
                let chosenIdx, currentMove, currentAxis;
                while (true) {
                    chosenIdx = Math.floor(Math.random() * movesConfig.length);
                    currentMove = movesConfig[chosenIdx];
                    currentAxis = currentMove.axis;
                    if (lastMoveIdx !== -1 && movesConfig[lastMoveIdx].face === currentMove.face) continue;
                    if (lastMoveIdx !== -1 && movesConfig[lastMoveIdx].axis === currentAxis) {
                        if (secondLastMoveIdx !== -1 && movesConfig[secondLastMoveIdx].face === currentMove.face) continue;
                    }
                    break;
                }
                let modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(currentMove.face + modifier);
                secondLastMoveIdx = lastMoveIdx;
                lastMoveIdx = chosenIdx;
            }
            return scramble.join(" ");
        }

        function generateAndDisplayScramble() {
            const display = document.getElementById("ui-scramble-display");
            if (currentUniverse === "2x2") {
                display.classList.remove("scramble-4x4");
                const moves = ["R", "U", "F"];
                const modifiers = ["", "'", "2"];
                let scramble = [];
                let lastFace = "";
                for (let i = 0; i < 8; i++) {
                    let face;
                    do {
                        face = moves[Math.floor(Math.random() * moves.length)];
                    } while (face === lastFace);
                    scramble.push(face + modifiers[Math.floor(Math.random() * modifiers.length)]);
                    lastFace = face;
                }
                display.innerText = scramble.join(" ");
            } else if (currentUniverse === "4x4") {
                display.classList.add("scramble-4x4");
                display.innerText = generate4x4Scramble();
            } else {
                display.classList.remove("scramble-4x4");
                display.innerText = generate3x3Scramble();
            }
        }
        function initLobby() {
            persistentLobby = [];
            for (let i = 1; i <= 23; i++) {
                let rolledVR = Math.round(playerVR[currentUniverse] + (Math.random() * 500 - 250));
                persistentLobby.push({
                    id: i,
                    name: `Cuber_Bot_${Math.floor(Math.random() * 90 + 10)}`,
                    vr: Math.max(1, Math.min(10000, rolledVR))
                });
            }
        }

        function cycleLobby() {
            let quitCount = Math.floor(Math.random() * 3) + 2;
            persistentLobby.sort(() => Math.random() - 0.5);
            persistentLobby.splice(0, quitCount);
            for (let i = 0; i < quitCount; i++) {
                let rolledVR = Math.round(playerVR[currentUniverse] + (Math.random() * 700 - 350));
                persistentLobby.push({
                    id: Math.floor(Math.random() * 1000),
                    name: `Cuber_Bot_${Math.floor(Math.random() * 90 + 10)}`,
                    vr: Math.max(1, Math.min(10000, rolledVR))
                });
            }
        }

        function gaussianRandom(mean, stdDev) {
            let u = 0, v = 0;
            while(u === 0) u = Math.random(); 
            while(v === 0) v = Math.random();
            return (Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v)) * stdDev + mean;
        }

        // ⚡【天梯池核心注入端】
        function injectScoreDirectly(val) {
            if (currentSolvePool.length >= 5) return;
            currentSolvePool.push(val);
            const activeIndex = currentSolvePool.length - 1;
            currentPoolStates[activeIndex] = 0;

            const slots = document.getElementById("ui-ao5-slots").children;
            const currentSlot = slots[activeIndex];
            if (currentSlot) {
                currentSlot.innerText = val.toFixed(2) + "s";
                currentSlot.classList.add("ao5-slot-active");
                currentSlot.onclick = function() {
                    toggleSlotPenalty(activeIndex);
                };
            }
            generateAndDisplayScramble();
            if (currentSolvePool.length === 5) {
                processAo5Calculation();
            }
        }

        function handleEnter(e) {
            if (e.key !== 'Enter' && e.code !== 'Enter' && e.keyCode !== 13) return;
            const val = parseFloat(e.target.value);
            if (isNaN(val) || val <= 0) return;
            e.target.value = "";
            injectScoreDirectly(val);
        }

        // ⚡【WCA 專業多模交互狀態機】
        function resetWcaTimerUi() {
            const panel = document.getElementById("ui-live-timer-panel");
            if (panel) {
                panel.className = "live-timer-display";
                panel.innerText = "TAP / SPACE TO INSPECT";
            }
        }

        function triggerTimerInteraction() {
            if (currentMode !== "TIMER") return;
            const panel = document.getElementById("ui-live-timer-panel");
            if (!panel) return;

            if (wcaState === "IDLE") {
                wcaState = "INSPECTION";
                inspectionCountdown = 15;
                panel.className = "live-timer-display timer-inspect";
                panel.innerText = "INSPECT: 15s";
                
                wcaIntervalId = setInterval(() => {
                    inspectionCountdown--;
                    if (inspectionCountdown <= 0) {
                        // 🛡️【15秒自動 DNF 防禦盾】：觀察時間超過 15 秒未開跑，直接強制判定 DNF 扣分！
                        clearInterval(wcaIntervalId);
                        wcaState = "IDLE";
                        panel.className = "live-timer-display";
                        panel.innerText = "DNF (OVERTIME)";
                        injectScoreDirectly(99999); 
                    } else {
                        panel.innerText = `INSPECT: ${inspectionCountdown}s`;
                    }
                }, 1000);
            } 
            else if (wcaState === "INSPECTION") {
                clearInterval(wcaIntervalId);
                wcaState = "RUNNING";
                wcaStartTime = Date.now();
                panel.className = "live-timer-display timer-go";
                panel.innerText = "0.00";
                
                wcaIntervalId = setInterval(() => {
                    let elapsed = (Date.now() - wcaStartTime) / 1000;
                    panel.innerText = elapsed.toFixed(2);
                }, 10);
            } 
            else if (wcaState === "RUNNING") {
                clearInterval(wcaIntervalId);
                let finalTime = (Date.now() - wcaStartTime) / 1000;
                wcaState = "IDLE";
                panel.className = "live-timer-display";
                panel.innerText = finalTime.toFixed(2) + "s";
                
                // 自動將最終計時時間寫入並開啟天梯結算
                injectScoreDirectly(finalTime);
            }
        }

        // 電腦空白鍵監聽
        window.addEventListener("keydown", function(e) {
            if (currentMode !== "TIMER") return;
            if (e.key === " " || e.code === "Space" || wcaState === "RUNNING") {
                e.preventDefault();
                triggerTimerInteraction();
            }
        });
        function toggleSlotPenalty(index) {
            currentPoolStates[index] = (currentPoolStates[index] + 1) % 3;
            const slots = document.getElementById("ui-ao5-slots").children;
            const currentSlot = slots[index];
            const baseTime = currentSolvePool[index];
            currentSlot.className = "ao5-slot ao5-slot-active";

            if (currentPoolStates[index] === 0) {
                currentSlot.innerText = baseTime.toFixed(2) + "s";
            } else if (currentPoolStates[index] === 1) {
                currentSlot.classList.add("ao5-slot-plus2");
                currentSlot.innerText = (baseTime + 2.0).toFixed(2) + "s+";
            } else if (currentPoolStates[index] === 2) {
                currentSlot.classList.add("ao5-slot-dnf");
                currentSlot.innerText = "DNF";
            }
        }

        // ⚡【防崩潰 Ao5 去頭去尾安全算法】
        function processAo5Calculation() {
            document.getElementById("ui-input-hint").innerText = "CALCULATING Ao5...";
            const slots = document.getElementById("ui-ao5-slots").children;
            
            setTimeout(() => {
                let validTimes = [];
                let dnfCount = 0;
                
                for (let i = 0; i < 5; i++) {
                    if (currentPoolStates[i] === 2) {
                        dnfCount++;
                        validTimes.push(999999); 
                    } else if (currentPoolStates[i] === 1) {
                        validTimes.push(currentSolvePool[i] + 2.0);
                    } else {
                        validTimes.push(currentSolvePool[i]);
                    }
                }
                
                for (let i = 0; i < 5; i++) {
                    slots[i].onclick = null;
                    slots[i].innerText = "-";
                    slots[i].className = "ao5-slot";
                }
                
                currentSolvePool = [];
                currentPoolStates = [];
                document.getElementById("ui-input-hint").innerText = "TIME + ENTER";
                
                if (dnfCount >= 2) {
                    handleDnfMatchFailure();
                    return;
                }
                
                validTimes.sort((a, b) => a - b);
                
                let middleThree = validTimes.slice(1, 4);
                let sum = middleThree.reduce(function(a, b) { return a + b; }, 0);
                let finalAo5 = sum / 3;
                
                if (isNaN(finalAo5) || finalAo5 > 99999) {
                    finalAo5 = 30.00; 
                }

                recentScores[currentUniverse].unshift(finalAo5);
                if (recentScores[currentUniverse].length > 5) recentScores[currentUniverse].pop();
                
                runMatchEngine(finalAo5);
            }, 600);
        }
                function handleDnfMatchFailure() {
            totalMatches[currentUniverse]++;
            document.getElementById("ui-match-rank").innerText = "DNF / 24th";
            
            const changeBadge = document.getElementById("ui-vr-change");
            changeBadge.innerText = "-200 VR";
            changeBadge.className = "vr-change-badge vr-minus vr-change-show";
            
            const oldVR = playerVR[currentUniverse];
            playerVR[currentUniverse] = Math.max(1, playerVR[currentUniverse] - 200);
            
            document.getElementById("ui-total-matches").innerText = totalMatches[currentUniverse];
            document.getElementById("ui-current-ao5").innerText = "DNF";
            document.getElementById("ui-leaderboard-list").innerHTML = "";
            document.getElementById("ui-new-record").style.visibility = "hidden";
            
            const config = UNIVERSE_CONFIG[currentUniverse];
            const updatedBaseline = config.base + (10000 - playerVR[currentUniverse]) / config.div;
             // 🏎️ 【DNF 分數滾動下降動畫】
            let currentTick = oldVR;
            clearInterval(window.tickInterval);
            window.tickInterval = setInterval(() => {
                if (currentTick <= playerVR[currentUniverse]) {
                    clearInterval(window.tickInterval);
                    document.getElementById("ui-player-vr").innerText = playerVR[currentUniverse];
                    updateTierGraphics(playerVR[currentUniverse]);
                    document.getElementById("ui-baseline-val").innerText = Math.max(config.minB, updatedBaseline).toFixed(2) + "s";
                    generateAndDisplayScramble();
                } else {
                    currentTick -= Math.ceil(Math.abs(oldVR - playerVR[currentUniverse]) / 40) || 1;
                    if(currentTick < playerVR[currentUniverse]) currentTick = playerVR[currentUniverse];
                    document.getElementById("ui-player-vr").innerText = currentTick;
                    updateTierGraphics(currentTick);
                }
            }, 10);

            saveGameData();
            cycleLobby();
        }

        function runMatchEngine(calculatedAo5) {
            if (!persistentLobby || persistentLobby.length === 0) initLobby();
            totalMatches[currentUniverse]++;
            const config = UNIVERSE_CONFIG[currentUniverse];
            const baseline = config.base + (10000 - playerVR[currentUniverse]) / config.div;
            let matchResults = [];

            persistentLobby.forEach(bot => {
                const vrDiff = bot.vr - playerVR[currentUniverse];
                const botBaseline = baseline * (1 - (vrDiff / 25000));
                const botSkillFactor = Math.max(100, bot.vr);
                const humanConsistency = 0.03 + (10000 - botSkillFactor) / 100000;

                let mult = gaussianRandom(1.0, humanConsistency);
                mult = Math.max(0.75, Math.min(1.35, mult));
                if (Math.random() < 0.01) mult *= 0.85;

                matchResults.push({
                    name: bot.name,
                    vr: Math.max(1, bot.vr),
                    time: parseFloat((Math.max(config.minB, botBaseline * mult)).toFixed(2)),
                    isPlayer: false
                });
            });

            matchResults.push({ name: "YOU", vr: playerVR[currentUniverse], time: calculatedAo5, isPlayer: true });
            matchResults.sort((a, b) => a.time - b.time);
            const playerRank = matchResults.findIndex(x => x.isPlayer) + 1;
            if (playerRank <= 3) podiumCount[currentUniverse]++;

            const totalBotVR = persistentLobby.reduce((sum, b) => sum + b.vr, 0);
            const avgBotVR = Math.max(1, Math.round(totalBotVR / 23));

            let bMultiplier = avgBotVR / Math.max(1, playerVR[currentUniverse]);
            bMultiplier = Math.min(1.2, Math.max(0.8, bMultiplier));

            const rankBonus = 1 + (12 - playerRank) * 0.02;
            const timeDiff = baseline - calculatedAo5;
            let vrChange = (timeDiff / 0.03) * bMultiplier;

            if (vrChange >= 0) {
                vrChange = vrChange * rankBonus;
            } else {
                vrChange = vrChange * (2 - rankBonus);
            }

            if (playerRank === 1) vrChange += 5;
            if (playerRank === 2) vrChange += 4;
            if (playerRank === 3) vrChange += 3;
            if (playerRank === 4) vrChange += 2;
            if (playerRank === 5) vrChange += 1;
           
            vrChange = Math.round(vrChange);

            if (playerRank === 1) vrChange = Math.max(15, vrChange);
            if (playerRank === 24) vrChange = Math.min(-15, vrChange);

            const oldVR = playerVR[currentUniverse];
            playerVR[currentUniverse] = Math.max(1, Math.min(10000, playerVR[currentUniverse] + vrChange));

            let isNewRecord = false;
            if (playerVR[currentUniverse] > peakVR[currentUniverse]) {
                peakVR[currentUniverse] = playerVR[currentUniverse];
                isNewRecord = true;
            }

            const nextBaseline = config.base + (10000 - playerVR[currentUniverse]) / config.div;
                        // 🏎️ 【VR 滾動飙升動畫引擎】
            let currentTick = oldVR;
            clearInterval(window.tickInterval);
            let step = Math.ceil(Math.abs(playerVR[currentUniverse] - oldVR) / 50) || 1;

            window.tickInterval = setInterval(() => {
                if (currentTick === playerVR[currentUniverse]) {
                    clearInterval(window.tickInterval);
                    document.getElementById("ui-player-vr").innerText = playerVR[currentUniverse];
                    document.getElementById("ui-peak-vr").innerText = peakVR[currentUniverse];
                    document.getElementById("ui-baseline-val").innerText = nextBaseline.toFixed(2) + "s";
                    updateTierGraphics(playerVR[currentUniverse]);
                    generateAndDisplayScramble();
                } else {
                    if (currentTick < playerVR[currentUniverse]) {
                        currentTick = Math.min(playerVR[currentUniverse], currentTick + step);
                    } else {
                        currentTick = Math.max(playerVR[currentUniverse], currentTick - step);
                    }
                    document.getElementById("ui-player-vr").innerText = currentTick;
                    updateTierGraphics(currentTick);
                }
            }, 10);

            document.getElementById("ui-total-matches").innerText = totalMatches[currentUniverse];
            let rate = ((podiumCount[currentUniverse] / totalMatches[currentUniverse]) * 100).toFixed(0);
            document.getElementById("ui-podium-rate").innerText = `${rate}% / ${podiumCount[currentUniverse]}`;

            document.getElementById("ui-match-rank").innerText = `${playerRank}${getRankSuffix(playerRank)} / 24`;
            document.getElementById("ui-current-ao5").innerText = calculatedAo5.toFixed(2) + "s";
            document.getElementById("ui-room-avg").innerText = avgBotVR;
            document.getElementById("ui-multiplier").innerText = bMultiplier.toFixed(2);
            
            const cb = document.getElementById("ui-vr-change");
            if (vrChange >= 0) {
                cb.innerText = `+${vrChange} VR`;
                cb.className = "vr-change-badge vr-plus vr-change-show";
            } else {
                cb.innerText = `${vrChange} VR`;
                cb.className = "vr-change-badge vr-minus vr-change-show";
            }

            document.getElementById("ui-new-record").style.visibility = isNewRecord ? "visible" : "hidden";
            saveGameData();

            const list = document.getElementById("ui-leaderboard-list");
            list.innerHTML = "";
            matchResults.forEach((row, idx) => {
                const item = document.createElement("div");
                item.className = row.isPlayer ? "leaderboard-row row-player" : "leaderboard-row";
                item.style.animation = `slideInRow 0.3s forwards ${idx * 0.04}s`;
                item.innerHTML = `
                    <div class="col-left">
                        <span class="bot-rank">${idx + 1}</span>
                        <span class="bot-name">${row.name}</span>
                    </div>
                    <div class="col-right">
                        <span class="bot-vr">${row.vr}v</span>
                        <span class="bot-time ${row.isPlayer ? 'player-time' : ''}">${row.time.toFixed(2)}s</span>
                    </div>
                `;
                list.appendChild(item);
            });

            cycleLobby();
        }

        function getRankSuffix(r) {
            if (r === 1) return "st";
            if (r === 2) return "nd";
            if (r === 3) return "rd";
            return "th";
        }

        function switchUniverse(targetUniverse) {
            currentUniverse = targetUniverse;
            const tabs = document.getElementById("ui-tabs-container").children;
            for (let i = 0; i < tabs.length; i++) {
                const tab = tabs[i];
                const tabText = tab.innerText.trim().toUpperCase();
                if (
                    (targetUniverse === "3x3" && tabText === "3X3") ||
                    (targetUniverse === "2x2" && tabText === "2X2") ||
                    (targetUniverse === "4x4" && tabText === "4X4") ||
                    (targetUniverse === "OH" && (tabText === "ONE-HANDED" || tabText === "OH"))
                ) {
                    tab.classList.add("tab-active");
                } else {
                    tab.classList.remove("tab-active");
                }
            }

            currentSolvePool = [];
            const slots = document.getElementById("ui-ao5-slots").children;
            for (let i = 0; i < 5; i++) {
                slots[i].onclick = null;
                slots[i].innerText = "-";
                slots[i].className = "ao5-slot";
            }

            document.getElementById("ui-player-vr").innerText = playerVR[currentUniverse];
            document.getElementById("ui-peak-vr").innerText = peakVR[currentUniverse];
            document.getElementById("ui-total-matches").innerText = totalMatches[currentUniverse];
            
            const totalM = totalMatches[currentUniverse] || 1;
            document.getElementById("ui-podium-rate").innerText = ((podiumCount[currentUniverse] / totalM) * 100).toFixed(0) + "% / " + podiumCount[currentUniverse];

            const config = UNIVERSE_CONFIG[currentUniverse];
            const currentBaseline = config.base + (10000 - playerVR[currentUniverse]) / config.div;
            document.getElementById("ui-baseline-val").innerText = Math.max(config.minB, currentBaseline).toFixed(2) + "s";

            updateTierGraphics(playerVR[currentUniverse]);
            generateAndDisplayScramble();
            initLobby();

            if (currentMode === "TIMER") resetWcaTimerUi();

            document.getElementById("ui-match-rank").innerText = "--- / 24th";
            document.getElementById("ui-vr-change").className = "vr-change-badge";
            document.getElementById("ui-vr-change").innerText = "+0 VR";
            document.getElementById("ui-room-avg").innerText = "-";
            document.getElementById("ui-multiplier").innerText = "-";
            document.getElementById("ui-current-ao5").innerText = "-";
            document.getElementById("ui-leaderboard-list").innerHTML = "";
        }

        // 系統初始啟動疊棧
        initLobby();
        generateAndDisplayScramble();
        
        // 初始動態隱藏切換
        document.getElementById("ui-live-timer-panel").style.display = "none";
        document.getElementById("manual-input").style.display = "inline-block";
        document.getElementById("ui-input-hint").style.display = "inline";

        document.getElementById("ui-player-vr").innerText = playerVR[currentUniverse];
        document.getElementById("ui-peak-vr").innerText = peakVR[currentUniverse];
        document.getElementById("ui-total-matches").innerText = totalMatches[currentUniverse];
        updateTierGraphics(playerVR[currentUniverse]);
            // ⚡【修復 Part 6-B2】：核心全數據洗白引擎（含安全防誤觸盾）
        function forceClearAllData() {
            if (confirm("Are you sure you want to RESET ALL DATA? This will wipe your VR, records, and history permanently!")) {
                // 抹除本地儲存的所有魔方快取檔案
                localStorage.removeItem('mkwcube_playerVR');
                localStorage.removeItem('mkwcube_peakVR');
                localStorage.removeItem('mkwcube_totalMatches');
                localStorage.removeItem('mkwcube_podiumCount');
                
                // 強制重整網頁，讓系統重新讀取全新的乾淨初始變數 (1 VR / 0 Matches)
                window.location.reload();
            }
        }
            
    </script>
